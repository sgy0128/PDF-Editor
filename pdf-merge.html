<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 合併工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --fg: #1d2421; --muted: #67716c;
    --line: #dde1dd; --accent: #0f6e5a; --accent-fg: #ffffff; --accent-soft: #e2f1ec;
    --danger: #b3261e; --danger-soft: #fbe9e7; --drop: #eef5f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a18; --panel: #1e2522; --fg: #e8ece9; --muted: #98a39d;
      --line: #313a36; --accent: #3fb598; --accent-fg: #0b1512; --accent-soft: #1d332d;
      --danger: #f2a49d; --danger-soft: #3a2220; --drop: #1b2823; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; background: var(--panel);
    padding: 28px 16px; text-align: center; cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); background: var(--drop); }
  #drop strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: .9rem; }
  #list { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .item.dragging { opacity: .4; }
  .item.target { border-color: var(--accent); box-shadow: 0 -2px 0 var(--accent); }
  .grip { cursor: grab; color: var(--muted); user-select: none; font-size: 1.1rem; }
  .idx { width: 1.8em; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .info { flex: 1; min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .82rem; }
  .range { width: 7.5em; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: .85rem; }
  .range.bad { border-color: var(--danger); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); padding: 5px 9px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .tools .grow { flex: 1; }
  .total { color: var(--muted); font-size: .9rem; }
  .merge { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px;
    padding-top: 20px; border-top: 1px solid var(--line); }
  .merge input { flex: 1; min-width: 180px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
  .merge .opt { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .merge input[type=checkbox] { flex: none; min-width: 0; width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
    padding: 9px 22px; font-weight: 600; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  #msg { margin-top: 14px; padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); display: none; }
  #msg.err { background: var(--danger-soft); color: var(--danger); }
  #msg.show { display: block; }
  .hint { color: var(--muted); font-size: .82rem; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>PDF 合併工具</h1>
  <p class="sub">檔案只在你的瀏覽器內處理，不會上傳到任何地方。</p>

  <div id="drop" tabindex="0" role="button" aria-label="選擇或拖曳 PDF 檔案">
    <strong>把 PDF 拖到這裡，或點擊選擇檔案</strong>
    <span>可一次選多個檔案，也支援 JPG、PNG 圖片（每張一頁）</span>
  </div>
  <input id="file" type="file" accept="application/pdf,image/jpeg,image/png" multiple hidden>

  <ul id="list"></ul>

  <div class="tools" id="tools" hidden>
    <span class="total" id="total"></span>
    <span class="grow"></span>
    <button id="sortName">依檔名排序</button>
    <button id="clear">全部清除</button>
  </div>

  <div class="merge">
    <input id="outName" type="text" aria-label="輸出檔名" spellcheck="false">
    <label class="opt"><input type="checkbox" id="even" checked>補足偶數頁</label>
    <button class="primary" id="go" disabled>合併並下載</button>
  </div>
  <div id="msg" role="status"></div>

  <p class="hint">拖曳左側 ⋮⋮ 或用上下鍵調整順序。「頁碼」欄可只取部分頁面，例如 1-3,5，留空代表全部。</p>
</main>

<script>
(function () {
  var items = [];
  var nextId = 1;
  var $ = function (s) { return document.querySelector(s); };
  var list = $("#list"), msg = $("#msg");

  function today() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
  }
  $("#outName").value = "合併_" + today() + ".pdf";

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function show(text, err) { msg.textContent = text; msg.className = "show" + (err ? " err" : ""); }
  function hide() { msg.className = ""; }

  async function addFiles(files) {
    hide();
    var failed = [];
    for (var f of Array.from(files)) {
      var isImg = /^image\/(jpeg|png)$/.test(f.type);
      var isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
      if (!isImg && !isPdf) { failed.push(f.name + "（不支援的格式）"); continue; }
      try {
        var buf = await f.arrayBuffer();
        var pages = 1, raster = false;
        if (isPdf) {
          try {
            var doc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
            if (doc.isEncrypted) throw new Error("encrypted");
            pages = doc.getPageCount();
          } catch (e1) { pages = await rasterPages(buf); raster = true; }
        }
        items.push({ id: nextId++, name: f.name, kind: isImg ? "img" : "pdf", type: f.type,
          pages: pages, size: f.size, range: "", buf: buf, raster: raster });
      } catch (e) {
        failed.push(f.name + "（無法讀取，可能需要開啟密碼或檔案損毀）");
      }
    }
    render();
    if (failed.length) show("以下檔案未加入：" + failed.join("、"), true);
  }

  function parseRange(text, pages) {
    text = text.trim();
    if (!text) return Array.from({ length: pages }, function (_, i) { return i; });
    var out = [];
    text.split(/[,，]/).forEach(function (part) {
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(\d+)(?:\s*[-–~]\s*(\d+))?$/);
      if (!m) throw new Error("頁碼格式錯誤：" + part);
      var a = +m[1], b = m[2] ? +m[2] : a;
      if (a < 1 || b < a || b > pages) throw new Error("頁碼超出範圍（共 " + pages + " 頁）：" + part);
      for (var i = a; i <= b; i++) out.push(i - 1);
    });
    if (!out.length) throw new Error("頁碼不能為空");
    return out;
  }

  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  async function rasterPages(buf) {
    var d = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise, n = d.numPages; d.destroy(); return n;
  }
  /* 有權限限制（加密）的 PDF：把每頁轉成圖片再放進合併檔 */
  async function rasterInto(out, it, idx, evenPad) {
    var d = await pdfjsLib.getDocument({ data: it.buf.slice(0) }).promise, lastSz = null;
    try {
      for (var i of idx) {
        var pg = await d.getPage(i + 1), v1 = pg.getViewport({ scale: 1 }), v2 = pg.getViewport({ scale: 2.5 });
        var c = document.createElement("canvas"); c.width = Math.floor(v2.width); c.height = Math.floor(v2.height);
        var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        await pg.render({ canvasContext: ctx, viewport: v2 }).promise;
        var blob = await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.88); });
        var im = await out.embedJpg(await blob.arrayBuffer());
        out.addPage([v1.width, v1.height]).drawImage(im, { x: 0, y: 0, width: v1.width, height: v1.height });
        lastSz = [v1.width, v1.height]; c.width = c.height = 0;
      }
    } finally { d.destroy(); }
    if (evenPad && idx.length % 2 === 1 && lastSz) { out.addPage(lastSz); return 1; }
    return 0;
  }

  function validRange(it) { try { parseRange(it.range, it.pages); return true; } catch (e) { return false; } }

  function render() {
    list.innerHTML = items.map(function (it, i) {
      return '<li class="item" draggable="true" data-id="' + it.id + '">' +
        '<span class="grip" aria-hidden="true">⋮⋮</span>' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<div class="info"><div class="name" title="' + esc(it.name) + '">' + esc(it.name) + '</div>' +
        '<div class="meta">' + (it.kind === "img" ? "圖片" : it.pages + " 頁") + ' · ' + size(it.size) + (it.raster ? ' · 加密檔，將以圖片方式合併' : '') + '</div></div>' +
        (it.kind === "pdf" ? '<input class="range' + (validRange(it) ? "" : " bad") + '" data-act="range" placeholder="頁碼：全部" value="' + esc(it.range) + '" aria-label="頁碼範圍">' : "") +
        '<button data-act="up" aria-label="上移"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
        '<button data-act="down" aria-label="下移"' + (i === items.length - 1 ? " disabled" : "") + '>↓</button>' +
        '<button data-act="del" aria-label="移除">✕</button></li>';
    }).join("");
    $("#tools").hidden = !items.length;
    $("#go").disabled = !items.length;
    var total = 0;
    items.forEach(function (it) { try { total += parseRange(it.range, it.pages).length; } catch (e) {} });
    $("#total").textContent = items.length + " 個檔案 · 合計 " + total + " 頁";
  }

  function find(el) {
    var li = el.closest(".item");
    if (!li) return -1;
    return items.findIndex(function (x) { return x.id === +li.dataset.id; });
  }
  function move(i, j) { var t = items.splice(i, 1)[0]; items.splice(j, 0, t); render(); }

  list.addEventListener("click", function (e) {
    var act = e.target.dataset.act; if (!act || act === "range") return;
    var i = find(e.target); if (i < 0) return;
    if (act === "up" && i > 0) move(i, i - 1);
    if (act === "down" && i < items.length - 1) move(i, i + 1);
    if (act === "del") { items.splice(i, 1); render(); }
  });
  list.addEventListener("input", function (e) {
    if (e.target.dataset.act !== "range") return;
    var i = find(e.target); items[i].range = e.target.value;
    e.target.classList.toggle("bad", !validRange(items[i]));
    var total = 0;
    items.forEach(function (it) { try { total += parseRange(it.range, it.pages).length; } catch (x) {} });
    $("#total").textContent = items.length + " 個檔案 · 合計 " + total + " 頁";
  });

  var dragId = null;
  list.addEventListener("dragstart", function (e) {
    var li = e.target.closest(".item"); if (!li) return;
    dragId = +li.dataset.id; li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "");
  });
  list.addEventListener("dragover", function (e) {
    if (dragId === null) return;
    e.preventDefault();
    list.querySelectorAll(".target").forEach(function (n) { n.classList.remove("target"); });
    var li = e.target.closest(".item"); if (li) li.classList.add("target");
  });
  list.addEventListener("drop", function (e) {
    if (dragId === null) return;
    e.preventDefault();
    var from = items.findIndex(function (x) { return x.id === dragId; });
    var to = find(e.target);
    dragId = null;
    if (from >= 0 && to >= 0 && from !== to) move(from, to); else render();
  });
  list.addEventListener("dragend", function () { dragId = null; render(); });

  var drop = $("#drop"), input = $("#file");
  drop.addEventListener("click", function () { input.click(); });
  drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", function () { addFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach(function (n) {
    drop.addEventListener(n, function (e) { if (dragId !== null) return; e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (n) { drop.addEventListener(n, function () { drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { if (dragId !== null) return; e.preventDefault(); addFiles(e.dataTransfer.files); });
  // 避免拖曳到頁面其他位置時瀏覽器直接開啟檔案
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { if (!drop.contains(e.target)) e.preventDefault(); });

  $("#sortName").addEventListener("click", function () {
    items.sort(function (a, b) { return a.name.localeCompare(b.name, "zh-Hant", { numeric: true }); });
    render();
  });
  $("#clear").addEventListener("click", function () { items = []; hide(); render(); });

  $("#go").addEventListener("click", async function () {
    var btn = this; hide();
    try {
      var jobs = items.map(function (it) { return { it: it, idx: parseRange(it.range, it.pages) }; });
      btn.disabled = true; btn.textContent = "合併中…";
      var out = await PDFLib.PDFDocument.create();
      var evenPad = $("#even").checked, blanks = 0;
      for (var j of jobs) {
        var it = j.it;
        if (it.raster) {
          blanks += await rasterInto(out, it, j.idx, evenPad);
        } else if (it.kind === "pdf") {
          var src = await PDFLib.PDFDocument.load(it.buf, { ignoreEncryption: true });
          var pgs = await out.copyPages(src, j.idx);
          var lastPg;
          pgs.forEach(function (p) { lastPg = out.addPage(p); });
          if (evenPad && pgs.length % 2 === 1) { var sz = lastPg.getSize(); out.addPage([sz.width, sz.height]); blanks++; }
        } else {
          var img = it.type === "image/png" ? await out.embedPng(it.buf) : await out.embedJpg(it.buf);
          var page = out.addPage([img.width, img.height]);
          page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
          if (evenPad) { out.addPage([img.width, img.height]); blanks++; }
        }
      }
      var bytes = await out.save();
      var name = ($("#outName").value.trim() || "合併.pdf");
      if (!/\.pdf$/i.test(name)) name += ".pdf";
      var url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      var a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      show("完成：" + name + "（" + out.getPageCount() + " 頁，" + size(bytes.length) + (blanks ? "，補了 " + blanks + " 張空白頁" : "") + "）");
    } catch (e) {
      show("合併失敗：" + e.message, true);
    } finally {
      btn.textContent = "合併並下載"; btn.disabled = !items.length;
    }
  });

  try { var ev = localStorage.getItem("pdf-merge-even"); if (ev !== null) $("#even").checked = ev === "1"; } catch (e) {}
  $("#even").addEventListener("change", function () { try { localStorage.setItem("pdf-merge-even", this.checked ? "1" : "0"); } catch (e) {} });
  if (!window.PDFLib) show("無法載入 PDF 處理元件，請確認網路連線後重新整理頁面。", true);
  render();
})();
</script>
</body>
</html>
