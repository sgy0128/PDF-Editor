<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">

<title>PDF 批次壓縮與打包</title>
<script>(function(){var t=null,m=location.search.match(/[?&]theme=(dark|light)/);try{if(m){t=m[1];localStorage.setItem("pdf-tools-theme",t)}else t=localStorage.getItem("pdf-tools-theme")}catch(e){if(m)t=m[1]}document.documentElement.dataset.theme=t==="dark"?"dark":"light"})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2255c'/%3E%3Cpath d='M20 10h18l12 12v28a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z' fill='white'/%3E%3Cpath d='M32 26v16M25 36l7 7 7-7' fill='none' stroke='%23c2255c' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #fbfcfe; --panel: #ffffff; --fg: #19263a; --muted: #5d6b82; --line: #e3e9f2;
    --accent: #c2255c; --accent-fg: #ffffff; --accent-soft: #fde7ef;
    --danger: #c62828; --danger-soft: #fdecec; --warn: #7a5a00; --warn-bg: #fff4d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1724; --panel: #172133; --fg: #e7edf7; --muted: #94a3bb; --line: #2a3750;
    --accent: #ff8fb1; --accent-fg: #0b1220; --accent-soft: #3d1f2b;
    --danger: #ff8a80; --danger-soft: #3a1f24; --warn: #f0cf7a; --warn-bg: #3a3014;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
  .lbl { font-size: .85rem; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  input[type=text] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; min-width: 0; width: 100%; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); padding: 7px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, #drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; padding: 9px 22px; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); margin-top: 10px; }
  label.chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; cursor: pointer; font-size: .9rem; }
  label.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  .radios { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .radios input { accent-color: var(--accent); }
  select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; min-width: 0; width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .hint { color: var(--muted); font-size: .82rem; margin: 8px 0 0; }
  ul.notes { margin: 12px 0 0; padding-left: 1.2em; color: var(--muted); font-size: .85rem; display: flex; flex-direction: column; gap: 3px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop.busy { opacity: .5; pointer-events: none; }
  #drop strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: .9rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  #msg { padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); display: none; word-break: break-all; }
  #msg.show { display: block; }
  #msg.err { background: var(--danger-soft); color: var(--danger); }
  #msg.warn { background: var(--warn-bg); color: var(--warn); }
  .where { color: var(--muted); font-size: .85rem; margin: 0 0 8px; word-break: break-all; }
  .sum { margin: 0 0 8px; font-weight: 600; }
  .sum.warn { color: var(--warn); }
  #blist { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow-y: auto; font-size: .85rem; display: flex; flex-direction: column; gap: 4px; }
  #blist li { display: flex; gap: 8px; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  #blist li.warn { background: var(--warn-bg); border-color: var(--warn); }
  #blist li.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  #blist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #blist .mt { color: var(--muted); white-space: nowrap; }
  #blist li.bad .mt { color: var(--danger); }
  .theme-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel); color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn svg { width: 16px; height: 16px; }
  .theme-btn .i-sun, .theme-btn .lbl-light { display: none; }
  :root[data-theme="dark"] .theme-btn .i-sun, :root[data-theme="dark"] .theme-btn .lbl-light { display: inline; }
  :root[data-theme="dark"] .theme-btn .i-moon, :root[data-theme="dark"] .theme-btn .lbl-dark { display: none; }
  .home { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 14px 5px 6px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg);
    text-decoration: none; font-size: .88rem; font-weight: 600; white-space: nowrap; transition: border-color .15s, color .15s; }
  .home .hi { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .home .hi svg { width: 14px; height: 14px; }
  .home:hover, .home:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  .home:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
</style>
</head>
<body>
<main>
  <div class="topbar"><a class="home" data-nav="index.html" href="index.html" title="回到工具箱首頁"><span class="hi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>工具箱首頁</a><button class="theme-btn" id="themeBtn" type="button" aria-label="切換深色或淺色主題" title="切換深色或淺色主題"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl-dark">深色</span><span class="lbl-light">淺色</span></button></div>
  <div>
    <h1>PDF 批次壓縮與打包</h1>
    <p class="sub">把資料夾裡的多個 PDF 或圖片<strong>打包成一個 ZIP</strong>，也可以順便逐檔縮小、統一成 A4（每個檔案各自處理，檔名不變）。檔案只在你的瀏覽器內處理。想自己調整頁面、合併成一份 PDF，請用「<a data-nav="pdf-organize.html" href="pdf-organize.html">PDF 頁面整理</a>」。</p>
  </div>

  <section class="box">
    <h2>1. 設定</h2>
    <p class="lbl" style="margin-top:0">輸出方式</p>
    <div class="radios">
      <label><input type="radio" name="outmode" value="zip" checked>打包成一個 ZIP 檔</label>
      <label><input type="radio" name="outmode" value="folder">各自存成檔案，放進新建的子資料夾</label>
    </div>
    <label class="f" id="zipWrap">ZIP 檔名<input id="zipName" type="text" spellcheck="false"></label>
    <label class="f" id="zipMaxWrap">每個 ZIP 的大小上限（超過就自動分成多個）
      <select id="zipMax">
        <option value="0">不限制，全部放進一個 ZIP</option>
        <option value="7" selected>7 MB（寄 10MB 信箱，已預留編碼膨脹）</option>
        <option value="9">9 MB</option>
        <option value="18">18 MB（寄 25MB 信箱）</option>
        <option value="45">45 MB</option>
      </select>
    </label>

    <p class="lbl">檔案處理（不想改動檔案就保持預設）</p>
    <div class="radios">
      <label><input type="radio" name="size" value="orig" checked>保持每頁原尺寸</label>
      <label><input type="radio" name="size" value="a4">全部統一成 A4</label>
    </div>
    <div id="a4opts" class="two" hidden>
      <label class="f">方向
        <select id="orient">
          <option value="auto">依每頁原本方向</option>
          <option value="portrait">全部直式</option>
          <option value="landscape">全部橫式</option>
        </select>
      </label>
      <label class="f">邊距
        <select id="margin">
          <option value="0">無邊距</option>
          <option value="5">5 mm</option>
          <option value="10">10 mm</option>
        </select>
      </label>
    </div>
    <label class="f">縮小檔案（壓縮畫質）
      <select id="preset">
        <option value="none">不縮小（保留文字與原品質）</option>
        <option value="high">高畫質（200 dpi）</option>
        <option value="std">標準（150 dpi）</option>
        <option value="small">小檔案（110 dpi）</option>
        <option value="tiny">極小（80 dpi）</option>
      </select>
    </label>
    <label class="chk" id="grayWrap"><input type="checkbox" id="gray">轉成灰階（黑白文件更省空間）</label>
    <p class="hint" id="presetHint"></p>
  </section>

  <section class="box">
    <h2>2. 選擇資料夾</h2>
    <div id="drop" tabindex="0" role="button" aria-label="選擇或拖曳資料夾">
      <strong>把要處理的資料夾拖到這裡</strong>
      <span>或點這裡選擇資料夾。子資料夾裡的 PDF、JPG、PNG 也會一起處理。</span>
    </div>
    <ul class="notes" id="notes"></ul>
    <input id="dirIn" type="file" webkitdirectory multiple hidden>
    <div id="msg" role="status" style="margin-top:12px"></div>
  </section>

  <section class="box" id="result" hidden>
    <h2>處理結果</h2>
    <p class="where" id="where"></p>
    <p class="sum" id="sum"></p>
    <ul id="blist"></ul>
    <div class="row">
      <button id="stop" type="button" hidden>停止</button>
      <button id="clearLog" type="button">清除紀錄</button>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const A4 = [595.28, 841.89];
  const MEDIA = /\.(pdf|jpe?g|png)$/i;
  const PRESETS = { none: null, high: { dpi: 200, q: 0.85 }, std: { dpi: 150, q: 0.75 }, small: { dpi: 110, q: 0.6 }, tiny: { dpi: 80, q: 0.5 } };
  const FALLBACK = PRESETS.high;       // 加密或結構特殊的 PDF 改用圖片方式時的畫質
  const IMG_PT = 72 / 150;             // 圖片以 150 dpi 換算成頁面點數
  const KEY = "pdf-batch-v1";
  const msg = $("#msg"), drop = $("#drop");

  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function show(t, kind) { msg.textContent = t; msg.className = "show" + (kind ? " " + kind : ""); }
  function hide() { msg.className = ""; }
  function tick() { return new Promise((r) => setTimeout(r, 0)); }
  function normRot(a) { a = Math.round(a / 90) * 90; return ((a % 360) + 360) % 360; }
  function today() { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }

  if (!window.PDFLib || !window.pdfjsLib) { show("無法載入 PDF 處理元件，請確認網路連線後重新整理頁面。", "err"); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* ---------- 設定 ---------- */
  function sizeMode() { return document.querySelector("input[name=size]:checked").value; }
  function outMode() { return document.querySelector("input[name=outmode]:checked").value; }
  function readOpts() {
    return { size: sizeMode(), orient: $("#orient").value, margin: +$("#margin").value, pre: PRESETS[$("#preset").value], gray: $("#gray").checked, out: outMode(), max: +$("#zipMax").value };
  }
  const isRaw = (o) => !o.pre && o.size === "orig";   // 不縮小也不轉 A4：檔案原封不動
  function saveSet() {
    try { localStorage.setItem(KEY, JSON.stringify({ size: sizeMode(), out: outMode(), zipMax: $("#zipMax").value, orient: $("#orient").value, margin: $("#margin").value, preset: $("#preset").value, gray: $("#gray").checked })); } catch (e) {}
  }
  function loadSet() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (!s) return;
      const r = document.querySelector("input[name=size][value=" + (s.size === "a4" ? "a4" : "orig") + "]"); if (r) r.checked = true;
      const m = document.querySelector("input[name=outmode][value=" + (s.out === "folder" ? "folder" : "zip") + "]"); if (m) m.checked = true;
      if (s.zipMax != null && document.querySelector("#zipMax option[value=\"" + s.zipMax + "\"]")) $("#zipMax").value = s.zipMax;
      if (s.orient) $("#orient").value = s.orient;
      if (s.margin) $("#margin").value = s.margin;
      if (s.preset && PRESETS.hasOwnProperty(s.preset)) $("#preset").value = s.preset;
      $("#gray").checked = !!s.gray;
    } catch (e) {}
  }
  function renderNotes() {
    const picker = !!window.showDirectoryPicker;
    $("#notes").innerHTML = outMode() === "zip"
      ? "<li>所有結果合成一個 ZIP 下載，原檔完全不會被動到，也不需要允許瀏覽器編輯你的資料夾。</li>" +
        "<li>ZIP 只是把檔案打包在一起。PDF 和圖片本來就壓不小，所以檔案不會明顯變小；想縮小要在上面選「縮小檔案」的畫質。</li>" +
        "<li>設了大小上限時，會依檔名順序自動分成多個 ZIP（_1、_2…）。分包會一次下載多個檔案，瀏覽器若詢問「允許下載多個檔案」請按允許。單一檔案本身超過上限時，它會自己成一包。</li><li>打包期間結果會暫存在記憶體，總量太大請分批。</li>" +
        (picker ? "<li>桌面、文件、下載這類系統資料夾會被瀏覽器拒絕，請選它底下的子資料夾。</li>" : "")
      : picker
        ? "<li>結果存到你選的資料夾裡自動新建的「壓縮結果_日期」，原檔不會被修改，每次執行都會建新的。</li>" +
          "<li>瀏覽器會問「要讓網站編輯檔案嗎」，是為了建立上面那個子資料夾。</li>" +
          "<li>桌面、文件、下載這類系統資料夾會被瀏覽器拒絕，請選它底下的子資料夾。</li>"
        : "<li>這個瀏覽器無法直接寫入資料夾，結果會一個個下載（建議用 Chrome 或 Edge，並允許此網頁下載多個檔案）。要一次拿到所有檔案，請改選「打包成一個 ZIP 檔」。</li>";
  }
  function refreshControls() {
    const o = readOpts(), comp = !!o.pre;
    $("#a4opts").hidden = o.size !== "a4";
    $("#zipWrap").hidden = o.out !== "zip"; $("#zipMaxWrap").hidden = o.out !== "zip";
    $("#gray").disabled = !comp; $("#grayWrap").style.opacity = comp ? 1 : 0.5;
    $("#presetHint").textContent = comp
      ? "縮小會把每一頁轉成圖片，文字將無法選取、搜尋或複製。掃描檔效果最好；本來就很小的檔案可能反而變大。"
      : (o.out === "zip" && o.size === "orig"
          ? "目前的設定不會改動任何檔案，只是原封不動打包進 ZIP。"
          : "不縮小時，PDF 的文字與向量內容會保留。圖片檔一律轉成 JPEG 放入。");
    renderNotes();
  }
  ["orient", "margin", "preset", "gray", "zipMax"].forEach((id) => $("#" + id).addEventListener("input", () => { refreshControls(); saveSet(); }));
  document.querySelectorAll("input[name=size], input[name=outmode]").forEach((r) => r.addEventListener("change", () => { refreshControls(); saveSet(); }));
  $("#zipName").value = "壓縮結果_" + today() + ".zip";
  function checkOpts() {
    const o = readOpts();
    if (isRaw(o) && o.out !== "zip") {
      show("目前的設定不會改變檔案內容。請改選「打包成一個 ZIP 檔」，或選「全部統一成 A4」、一個縮小畫質。", "warn");
      return null;
    }
    return o;
  }

  /* ---------- 處理單一檔案的核心（與「PDF 頁面整理」相同） ---------- */
  function dispDims(p) { return p.rot % 180 ? [p.bh, p.bw] : [p.bw, p.bh]; }

  function drawRot(c, im, rot) {
    const ctx = c.getContext("2d");
    ctx.save(); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(rot * Math.PI / 180);
    const iw = rot % 180 ? c.height : c.width, ih = rot % 180 ? c.width : c.height;
    ctx.drawImage(im, -iw / 2, -ih / 2, iw, ih); ctx.restore();
  }

  /* 算出輸出頁面大小，以及內容放置的位置（A4 模式等比縮放後置中） */
  function layout(o, dw, dh) {
    let W = dw, H = dh, m = 0, s = 1;
    if (o.size === "a4") {
      W = A4[0]; H = A4[1];
      if (o.orient === "landscape" || (o.orient === "auto" && dw > dh)) { W = A4[1]; H = A4[0]; }
      m = o.margin * 72 / 25.4;
      s = Math.min((W - 2 * m) / dw, (H - 2 * m) / dh);
    }
    const w = dw * s, h = dh * s;
    return { W, H, s, w, h, x: (W - w) / 2, y: (H - h) / 2 };
  }
  /* 順時針旋轉 R 度時，drawPage / drawImage 的起點與旋轉角（pdf-lib 以起點為軸、逆時針為正） */
  function origin(R, X0, Y0, sw, sh) {
    if (R === 90) return { x: X0, y: Y0 + sw, rot: 270 };
    if (R === 180) return { x: X0 + sw, y: Y0 + sh, rot: 180 };
    if (R === 270) return { x: X0 + sh, y: Y0, rot: 90 };
    return { x: X0, y: Y0, rot: 0 };
  }
  function toGray(c) {
    const ctx = c.getContext("2d"), d = ctx.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { const g = (a[i] * 299 + a[i + 1] * 587 + a[i + 2] * 114) / 1000 | 0; a[i] = a[i + 1] = a[i + 2] = g; }
    ctx.putImageData(d, 0, 0);
  }
  async function placeCanvas(out, c, o, pre, L) {
    if (o.gray && o.pre) toGray(c);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", pre.q));
    const im = await out.embedJpg(await blob.arrayBuffer());
    out.addPage([L.W, L.H]).drawImage(im, { x: L.x, y: L.y, width: L.w, height: L.h });
    c.width = c.height = 0;
  }
  async function addRasterPage(out, p, o, pre) {
    const pg = await p.src.doc.getPage(p.idx + 1), R = (pg.rotate + p.rot) % 360;
    const v1 = pg.getViewport({ scale: 1, rotation: R }), L = layout(o, v1.width, v1.height);
    let s = L.s * pre.dpi / 72, vp = pg.getViewport({ scale: s, rotation: R });
    const MAXPX = 36e6;
    if (vp.width * vp.height > MAXPX) { s *= Math.sqrt(MAXPX / (vp.width * vp.height)); vp = pg.getViewport({ scale: s, rotation: R }); }
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    await placeCanvas(out, c, o, pre, L);
  }
  async function addImagePage(out, p, o) {
    const im = p.src.img, u = p.rot, iw = im.naturalWidth, ih = im.naturalHeight;
    const nw = u % 180 ? ih : iw, nh = u % 180 ? iw : ih;
    const d = dispDims(p), L = layout(o, d[0], d[1]), pre = o.pre || { q: 0.92 };
    let pw = nw;
    if (o.pre) pw = Math.min(nw, Math.max(1, Math.round(L.w * o.pre.dpi / 72)));
    const ph = Math.max(1, Math.round(pw * nh / nw));
    const c = document.createElement("canvas"); c.width = pw; c.height = ph;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pw, ph);
    drawRot(c, im, u);
    await placeCanvas(out, c, o, pre, L);
  }

  /* 把一串頁面組成一份 PDF。list 內每一項只需要 type、src、idx、rot、bw、bh，不需要畫面上的卡片 */
  async function buildPdf(list, o, say) {
    const out = await PDFLib.PDFDocument.create();
    const embeds = new Map(), rasterSrc = new Set(), usedBy = new Map();
    list.forEach((p) => { if (p.src) usedBy.set(p.src.id, (usedBy.get(p.src.id) || 0) + 1); });

    if (!o.pre) {   /* 不壓縮：保留向量與文字。每個來源檔一次處理，共用的字型等資源只會存一份 */
      const groups = new Map();
      list.forEach((p) => {
        if (p.type !== "pdf") return;
        if (!groups.has(p.src.id)) groups.set(p.src.id, { src: p.src, idx: new Set() });
        groups.get(p.src.id).idx.add(p.idx);
      });
      for (const g of groups.values()) {
        say("準備 " + g.src.name + "…"); await tick();
        try {
          const lib = await PDFLib.PDFDocument.load(g.src.buf, { ignoreEncryption: true });
          if (lib.isEncrypted) throw new Error("encrypted");
          const idxs = Array.from(g.idx).sort((a, b) => a - b);
          const lps = idxs.map((i) => lib.getPage(i));
          const inh = lps.map((lp) => normRot(lp.getRotation().angle));
          if (o.size === "a4") {
            const bbs = lps.map((lp) => { const c = lp.getCropBox(); return { left: c.x, bottom: c.y, right: c.x + c.width, top: c.y + c.height }; });
            const emb = await out.embedPages(lps, bbs);
            idxs.forEach((i, k) => embeds.set(g.src.id + ":" + i, { e: emb[k], inh: inh[k] }));
          } else {
            const cp = await out.copyPages(lib, idxs);
            idxs.forEach((i, k) => embeds.set(g.src.id + ":" + i, { pg: cp[k], inh: inh[k] }));
          }
        } catch (err) { rasterSrc.add(g.src.id); }
      }
    }

    for (let k = 0; k < list.length; k++) {
      const p = list[k];
      say("處理中 " + (k + 1) + " / " + list.length + "…"); await tick();
      if (p.type === "blank") { const d = dispDims(p), L = layout(o, d[0], d[1]); out.addPage([L.W, L.H]); continue; }
      if (p.type === "img") { await addImagePage(out, p, o); continue; }
      const E = embeds.get(p.src.id + ":" + p.idx);
      if (!E) { await addRasterPage(out, p, o, o.pre || FALLBACK); continue; }
      const R = (E.inh + p.rot) % 360;
      if (E.e) {
        const ew = E.e.width, eh = E.e.height, dw = R % 180 ? eh : ew, dh = R % 180 ? ew : eh;
        const L = layout(o, dw, dh), pg = out.addPage([L.W, L.H]), sw = ew * L.s, sh = eh * L.s;
        const og = origin(R, L.x, L.y, sw, sh);
        pg.drawPage(E.e, { x: og.x, y: og.y, width: sw, height: sh, rotate: PDFLib.degrees(og.rot) });
      } else {
        E.pg.setRotation(PDFLib.degrees(R)); out.addPage(E.pg);
      }
    }

    say("儲存中…"); await tick();
    const bytes = await out.save();
    return { bytes, pageCount: out.getPageCount(), rasterSrc, usedBy };
  }

  function saveBlob(bytes, name) {
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  /* ---------- 讀取資料夾與逐檔處理 ---------- */
  function entryFile(en) { return new Promise((ok, no) => en.file(ok, no)); }
  function readAll(reader) {
    return new Promise((ok, no) => {
      let all = [];
      (function next() { reader.readEntries((b) => { if (!b.length) ok(all); else { all = all.concat(Array.from(b)); next(); } }, no); })();
    });
  }
  async function walkEntry(en, out) {
    try {
      if (en.isFile) { if (MEDIA.test(en.name)) out.push(await entryFile(en)); }
      else if (en.isDirectory) { for (const k of await readAll(en.createReader())) await walkEntry(k, out); }
    } catch (e) {}
  }

  const natPath = (a, b) => (a.dirs.join("/") + "/" + a.name).localeCompare(b.dirs.join("/") + "/" + b.name, "zh-Hant", { numeric: true });
  async function collectDir(dir, prefix, out) {
    for await (const ent of dir.values()) {
      try {
        if (ent.kind === "file") { if (MEDIA.test(ent.name)) out.push({ name: ent.name, dirs: prefix, get: () => ent.getFile() }); }
        else if (!(prefix.length === 0 && /^壓縮結果_/.test(ent.name))) await collectDir(ent, prefix.concat(ent.name), out);
      } catch (e) {}
    }
  }
  async function processOne(it, file, o, say) {
    if (/\.pdf$/i.test(it.name)) {
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false }).promise;
      try {
        const src = { id: 1, name: it.name, kind: "pdf", size: file.size, buf, doc, n: doc.numPages };
        const list = [];
        for (let i = 0; i < doc.numPages; i++) list.push({ type: "pdf", src, idx: i, rot: 0, bw: 0, bh: 0 });
        return await buildPdf(list, o, say);
      } finally { try { doc.destroy(); } catch (e) {} }
    }
    const url = URL.createObjectURL(file), im = new Image();
    try {
      await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = url; });
      const src = { id: 1, name: it.name, kind: "img", size: file.size, img: im, n: 1 };
      return await buildPdf([{ type: "img", src, idx: 0, rot: 0, bw: im.naturalWidth * IMG_PT, bh: im.naturalHeight * IMG_PT }], o, say);
    } finally { URL.revokeObjectURL(url); }
  }
  /* 在輸出資料夾裡找一個不會蓋掉現有檔案的名字 */
  async function freeName(dir, used, name) {
    const m = name.match(/\.[^.]+$/), ext = m ? m[0] : "", stem = name.slice(0, name.length - ext.length);
    let cand = name, n = 0;
    for (;;) {
      if (!used.has(cand.toLowerCase())) {
        let exists = false;
        if (dir) { try { await dir.getFileHandle(cand); exists = true; } catch (e) { exists = e.name !== "NotFoundError"; } }
        if (!exists) break;
      }
      if (++n > 9999) throw new Error("同名檔案太多");
      cand = stem + " (" + n + ")" + ext;
    }
    used.add(cand.toLowerCase());
    return cand;
  }

  /* ---------- ZIP：只存放、不再壓縮（PDF 與圖片本來就壓不小） ---------- */
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function makeZip(entries) {
    const enc = new TextEncoder(), parts = [], central = [], d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let offset = 0;
    for (const e of entries) {
      const nameB = enc.encode(e.name), crc = crc32(e.data), len = e.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, len, true); lh.setUint32(22, len, true); lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nameB, e.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, len, true); ch.setUint32(24, len, true); ch.setUint16(28, nameB.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nameB);
      offset += 30 + nameB.length + len;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: "application/zip" });
  }
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  let busy = false, stopFlag = false;
  function setRunning(r) {
    busy = r; drop.classList.toggle("busy", r);
    $("#stop").hidden = !r; $("#clearLog").hidden = r;
  }

  /* sink：{ zip: true } 打包成 ZIP；{ dir: 資料夾控制代碼 } 寫進資料夾；{} 一個個下載 */
  async function runItems(items, sink, o, label) {
    items.sort(natPath);
    const ul = $("#blist"), sum = $("#sum"), raw = isRaw(o), zip = !!sink.zip, zipEntries = [];
    ul.innerHTML = ""; sum.className = "sum"; sum.textContent = "";
    $("#where").textContent = zip ? "輸出：ZIP 檔（會下載到瀏覽器的下載資料夾）" : label ? "輸出位置：" + label : "結果會一個個下載到瀏覽器的下載資料夾";
    $("#result").hidden = false; hide(); setRunning(true); stopFlag = false;
    const dirCache = new Map(), usedNames = new Map();
    let before = 0, after = 0, ok = 0, bad = 0, kept = 0, done = 0, zipBytes = 0;
    for (let i = 0; i < items.length; i++) {
      if (stopFlag) break;
      const it = items[i], li = document.createElement("li"), nm = document.createElement("span"), mt = document.createElement("span");
      nm.className = "nm"; mt.className = "mt";
      nm.textContent = (it.dirs.length ? it.dirs.join("/") + "/" : "") + it.name; nm.title = nm.textContent;
      mt.textContent = raw ? "讀取中…" : "處理中…";
      li.append(nm, mt); ul.appendChild(li); li.scrollIntoView({ block: "nearest" });
      sum.textContent = (raw ? "讀取中 " : "處理中 ") + (i + 1) + " / " + items.length + "…";
      try {
        const file = await it.get();
        let bytes, note = "", baseName;
        if (raw) { bytes = new Uint8Array(await file.arrayBuffer()); baseName = it.name; }
        else {
          const r = await processOne(it, file, o, (t) => { mt.textContent = t; });
          bytes = r.bytes; baseName = it.name.replace(/\.(jpe?g|png)$/i, ".pdf");
          if (o.size === "orig" && /\.pdf$/i.test(it.name) && bytes.length >= file.size) {
            bytes = new Uint8Array(await file.arrayBuffer()); note = "沒有變小，已保留原檔"; kept++;
          } else if (r.rasterSrc.size) note = "加密檔，已轉成圖片";
        }
        const key = it.dirs.join("/");
        if (!usedNames.has(key)) usedNames.set(key, new Set());
        let d = null;
        if (sink.dir) {
          if (!dirCache.has(key)) {
            let cur = sink.dir;
            for (const s of it.dirs) cur = await cur.getDirectoryHandle(s, { create: true });
            dirCache.set(key, cur);
          }
          d = dirCache.get(key);
        }
        const outName = await freeName(d, usedNames.get(key), baseName);
        if (zip) {
          zipBytes += bytes.length;
          if (zipBytes > 3.9e9 || zipEntries.length >= 65000) { stopFlag = true; throw new Error("超過 ZIP 的容量上限，請分批處理"); }
          zipEntries.push({ name: (key ? key + "/" : "") + outName, data: bytes });
        } else if (d) {
          const fh = await d.getFileHandle(outName, { create: true });
          const w = await fh.createWritable(); await w.write(bytes); await w.close();
        } else { saveBlob(bytes, outName); await new Promise((res) => setTimeout(res, 400)); }
        before += file.size; after += bytes.length; ok++;
        mt.textContent = raw ? size(file.size) : size(file.size) + " → " + size(bytes.length) + "（" + Math.round(bytes.length / Math.max(1, file.size) * 100) + "%）" + (note ? " · " + note : "");
        if (!raw && bytes.length > file.size) li.classList.add("warn");
      } catch (e) { bad++; li.classList.add("bad"); mt.textContent = "失敗：" + (e && e.message ? e.message : e); }
      done++; await tick();
    }
    const stopped = stopFlag;
    let zipInfo = "";
    if (zip && zipEntries.length) {
      sum.textContent = "正在產生 ZIP…"; await tick();
      let stem = ($("#zipName").value.trim() || "壓縮結果_" + today()).replace(/\.zip$/i, "");
      const limit = o.max > 0 ? o.max * 1024 * 1024 : Infinity, enc = new TextEncoder(), groups = [];
      let cur = [], curSize = 22;
      for (const en of zipEntries) {
        const add = 76 + 2 * enc.encode(en.name).length + en.data.length;
        if (cur.length && curSize + add > limit) { groups.push(cur); cur = []; curSize = 22; }
        cur.push(en); curSize += add;
      }
      groups.push(cur);
      const pad = String(groups.length).length, infos = []; let big = 0;
      for (let g = 0; g < groups.length; g++) {
        const zname = groups.length === 1 ? stem + ".zip" : stem + "_" + String(g + 1).padStart(pad, "0") + ".zip";
        try {
          const blob = makeZip(groups[g]); if (blob.size > limit) big++;
          downloadBlob(blob, zname); infos.push("「" + zname + "」" + size(blob.size));
        } catch (e) { bad++; infos.push(zname + " 產生失敗"); }
        if (g < groups.length - 1) await new Promise((r) => setTimeout(r, 700));
      }
      zipInfo = "。已下載 " + groups.length + " 個 ZIP：" + infos.join("、") + (big ? "；其中 " + big + " 個超過上限（裡面有單一檔案本身就比上限大）" : "");
    }
    setRunning(false);
    let t = (stopped ? "已停止：" : "完成：") + (zip ? "打包了 " : "處理了 ") + ok + " 個檔案";
    if (ok && before) t += raw ? "，合計 " + size(before) : "，合計 " + size(before) + " → " + size(after) + "（約 " + Math.round(after / before * 100) + "%）";
    if (kept) t += "；" + kept + " 個縮小後沒變小，已保留原檔";
    if (bad) t += "；" + bad + " 個失敗（可能需要開啟密碼、檔案損毀或超過容量）";
    if (stopped) t += "；還有 " + (items.length - done) + " 個沒處理";
    sum.textContent = t + zipInfo; sum.className = "sum" + (bad ? " warn" : "");
  }

  /* 已取得授權的資料夾：ZIP 模式直接開始；資料夾模式先在裡面新建子資料夾存結果 */
  async function startWithDir(srcDir, o) {
    show("讀取資料夾中…");
    const items = []; await collectDir(srcDir, [], items);
    if (!items.length) { show("這個資料夾裡沒有 PDF、JPG 或 PNG 檔案。", "err"); return; }
    if (o.out === "zip") { await runItems(items, { zip: true }, o); return; }
    const base = "壓縮結果_" + today();
    let name = base, n = 0;
    for (;;) {
      try { await srcDir.getDirectoryHandle(name); }
      catch (e) { if (e.name === "NotFoundError") break; if (e.name !== "TypeMismatchError") throw e; }
      name = base + " (" + (++n) + ")";
    }
    const outDir = await srcDir.getDirectoryHandle(name, { create: true });
    await runItems(items, { dir: outDir }, o, srcDir.name + " / " + name);
  }
  function fallbackItems(files) { return files.filter((f) => MEDIA.test(f.name)).map((f) => ({ name: f.name, dirs: [], get: async () => f })); }
  const fallbackSink = (o) => (o.out === "zip" ? { zip: true } : {});

  async function pickFolder() {
    if (busy) return;
    const o = checkOpts(); if (!o) return;
    hide();
    if (!window.showDirectoryPicker) { $("#dirIn").click(); return; }
    try {
      const dir = await window.showDirectoryPicker({ mode: o.out === "zip" ? "read" : "readwrite" });
      await startWithDir(dir, o);
    } catch (e) {
      if (e && e.name === "AbortError") { hide(); return; }
      show("無法使用資料夾：" + ((e && (e.name + " " + e.message)) || e), "err");
      setRunning(false);
    }
  }
  drop.addEventListener("click", pickFolder);
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFolder(); } });
  $("#dirIn").addEventListener("change", function () {
    const fl = fallbackItems(Array.from(this.files)); this.value = "";
    const o = checkOpts(); if (!o) return;
    if (!fl.length) { show("這個資料夾裡沒有 PDF、JPG 或 PNG 檔案。", "err"); return; }
    runItems(fl, fallbackSink(o), o);
  });

  /* 拖曳資料夾進來 */
  ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); if (!busy) drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, () => drop.classList.remove("over")));
  drop.addEventListener("drop", async (e) => {
    e.preventDefault();
    if (busy) return;
    const dt = e.dataTransfer;
    /* 這些必須在 await 之前同步取得，否則拖曳資料會失效 */
    const hps = dt.items ? Array.from(dt.items).map((it) => it.kind === "file" && it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : null) : [];
    const ents = dt.items ? Array.from(dt.items).map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean) : [];
    const plain = Array.from(dt.files);
    const o = checkOpts(); if (!o) return;
    hide();
    try {
      const dirs = (await Promise.all(hps)).filter((h) => h && h.kind === "directory");
      if (dirs.length) {
        const mode = o.out === "zip" ? "read" : "readwrite";
        const st = dirs[0].requestPermission ? await dirs[0].requestPermission({ mode }) : "denied";
        if (st === "granted") { if (dirs.length > 1) show("一次只處理一個資料夾，先處理「" + dirs[0].name + "」。"); await startWithDir(dirs[0], o); return; }
        show("沒有取得資料夾的權限。請重新拖一次，並在瀏覽器提示中允許；或改按這裡選擇資料夾。", "err");
        return;
      }
      if (ents.some((en) => en.isDirectory)) {
        show("讀取資料夾中…");
        const out = []; for (const en of ents) await walkEntry(en, out);
        const fl = fallbackItems(out);
        if (!fl.length) { show("這個資料夾裡沒有 PDF、JPG 或 PNG 檔案。", "err"); return; }
        await runItems(fl, fallbackSink(o), o);
      } else if (plain.length) show("這裡只能處理整個資料夾。單一檔案或要合併多個檔案，請用「PDF 頁面整理」。", "warn");
    } catch (err) { show("無法讀取：" + ((err && (err.name + " " + err.message)) || err), "err"); setRunning(false); }
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => { if (!drop.contains(e.target)) e.preventDefault(); });

  $("#stop").addEventListener("click", () => { stopFlag = true; $("#sum").textContent = "停止中，會在目前這個檔案處理完後停下…"; });
  $("#clearLog").addEventListener("click", () => { $("#blist").innerHTML = ""; $("#sum").textContent = ""; $("#where").textContent = ""; $("#result").hidden = true; hide(); });

  loadSet(); refreshControls();
})();
</script>
<script>
(function () {
  function cur() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
  function sync() { var t = cur(); document.querySelectorAll("a[data-nav]").forEach(function (a) { a.href = a.getAttribute("data-nav") + "?theme=" + t; }); }
  var b = document.getElementById("themeBtn");
  if (b) b.addEventListener("click", function () {
    var n = cur() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    try { localStorage.setItem("pdf-tools-theme", n); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
</body>
</html>
