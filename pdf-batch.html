<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">

<title>PDF 批次壓縮與打包</title>
<script>(function(){var t=null,m=location.search.match(/[?&]theme=(dark|light)/);try{if(m){t=m[1];localStorage.setItem("pdf-tools-theme",t)}else t=localStorage.getItem("pdf-tools-theme")}catch(e){if(m)t=m[1]}document.documentElement.dataset.theme=t==="dark"?"dark":"light"})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2255c'/%3E%3Cpath d='M20 10h18l12 12v28a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z' fill='white'/%3E%3Cpath d='M32 26v16M25 36l7 7 7-7' fill='none' stroke='%23c2255c' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #fbfcfe; --panel: #ffffff; --fg: #19263a; --muted: #5d6b82; --line: #e3e9f2;
    --accent: #c2255c; --accent-fg: #ffffff; --accent-soft: #fde7ef;
    --danger: #c62828; --danger-soft: #fdecec; --warn: #7a5a00; --warn-bg: #fff4d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1724; --panel: #172133; --fg: #e7edf7; --muted: #94a3bb; --line: #2a3750;
    --accent: #ff8fb1; --accent-fg: #0b1220; --accent-soft: #3d1f2b;
    --danger: #ff8a80; --danger-soft: #3a1f24; --warn: #f0cf7a; --warn-bg: #3a3014;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
  .lbl { font-size: .85rem; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  input[type=text] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; min-width: 0; width: 100%; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); padding: 7px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, #drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; padding: 9px 22px; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); margin-top: 10px; }
  label.chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; cursor: pointer; font-size: .9rem; }
  label.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  .radios { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .radios label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .radios input { accent-color: var(--accent); }
  select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; min-width: 0; width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .hint { color: var(--muted); font-size: .82rem; margin: 8px 0 0; }
  ul.notes { margin: 12px 0 0; padding-left: 1.2em; color: var(--muted); font-size: .85rem; display: flex; flex-direction: column; gap: 3px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop.busy { opacity: .5; pointer-events: none; }
  #drop strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: .9rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  #msg { padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); display: none; word-break: break-all; }
  #msg.show { display: block; }
  #msg.err { background: var(--danger-soft); color: var(--danger); }
  #msg.warn { background: var(--warn-bg); color: var(--warn); }
  .sum { margin: 0 0 8px; font-weight: 600; }
  .sum.warn { color: var(--warn); }
  #blist { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; font-size: .85rem; display: flex; flex-direction: column; gap: 4px; }
  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 8px; }
  .plan { margin: 0 0 4px; }
  #blist .x { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 1.1rem; line-height: 1; }
  #blist .x:hover { color: var(--danger); }
  #blist.lock .x { display: none; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  #blist li { align-items: center; display: flex; gap: 8px; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  #blist li.warn { background: var(--warn-bg); border-color: var(--warn); }
  #blist li.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  #blist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #blist .mt { color: var(--muted); white-space: nowrap; }
  #blist li.bad .mt { color: var(--danger); }
  .theme-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel); color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .theme-btn:hover { border-color: var(--accent); }
  .theme-btn svg { width: 16px; height: 16px; }
  .theme-btn .i-sun, .theme-btn .lbl-light { display: none; }
  :root[data-theme="dark"] .theme-btn .i-sun, :root[data-theme="dark"] .theme-btn .lbl-light { display: inline; }
  :root[data-theme="dark"] .theme-btn .i-moon, :root[data-theme="dark"] .theme-btn .lbl-dark { display: none; }
  .home { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 14px 5px 6px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg);
    text-decoration: none; font-size: .88rem; font-weight: 600; white-space: nowrap; transition: border-color .15s, color .15s; }
  .home .hi { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .home .hi svg { width: 14px; height: 14px; }
  .home:hover, .home:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  .home:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
</style>
</head>
<body>
<main>
  <div class="topbar"><a class="home" data-nav="index.html" href="index.html" title="回到工具箱首頁"><span class="hi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>工具箱首頁</a><button class="theme-btn" id="themeBtn" type="button" aria-label="切換深色或淺色主題" title="切換深色或淺色主題"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl-dark">深色</span><span class="lbl-light">淺色</span></button></div>
  <div>
    <h1>PDF 批次壓縮與打包</h1>
    <p class="sub">先把資料夾或檔案加進來，確認設定，再一鍵匯出成 ZIP（可自動分包），也能順便逐檔縮小、統一成 A4。檔案只在你的瀏覽器內處理，原檔不會被改動。想自己調整頁面、合併成一份 PDF，請用「<a data-nav="pdf-organize.html" href="pdf-organize.html">PDF 頁面整理</a>」。</p>
  </div>

  <section class="box">
    <h2>1. 加入檔案</h2>
    <div id="drop" tabindex="0" role="button" aria-label="選擇或拖曳資料夾與檔案">
      <strong>把資料夾或檔案拖到這裡</strong>
      <span>支援 PDF、JPG、PNG；資料夾裡的子資料夾也會一起加入。</span>
    </div>
    <div class="row">
      <button id="pickDir" type="button">選擇資料夾</button>
      <button id="pickFiles" type="button">選擇檔案</button>
    </div>
    <input id="dirIn" type="file" webkitdirectory multiple hidden>
    <input id="fileIn" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden>
    <div id="listWrap" hidden>
      <div class="listhead"><strong id="listSum"></strong><button id="clearAll" type="button">全部清除</button></div>
      <ul id="blist"></ul>
    </div>
  </section>

  <section class="box">
    <h2>2. 設定</h2>
    <fieldset id="setBox">
    <p class="lbl" style="margin-top:0">輸出方式</p>
    <div class="radios">
      <label><input type="radio" name="outmode" value="zip" checked>打包成 ZIP 檔</label>
      <label><input type="radio" name="outmode" value="each">每個檔案分別下載（不打包）</label>
    </div>
    <label class="f" id="zipWrap">ZIP 檔名<input id="zipName" type="text" spellcheck="false"></label>
    <label class="f" id="zipMaxWrap">每個 ZIP 的大小上限（超過就自動分成多個）
      <select id="zipMax">
        <option value="0">不限制，全部放進一個 ZIP</option>
        <option value="7" selected>7 MB（寄 10MB 信箱，已預留編碼膨脹）</option>
        <option value="9">9 MB</option>
        <option value="18">18 MB（寄 25MB 信箱）</option>
        <option value="45">45 MB</option>
      </select>
    </label>

    <p class="lbl">檔案處理（不想改動檔案就保持預設）</p>
    <div class="radios">
      <label><input type="radio" name="size" value="orig" checked>保持每頁原尺寸</label>
      <label><input type="radio" name="size" value="a4">全部統一成 A4</label>
    </div>
    <div id="a4opts" class="two" hidden>
      <label class="f">方向
        <select id="orient">
          <option value="auto">依每頁原本方向</option>
          <option value="portrait">全部直式</option>
          <option value="landscape">全部橫式</option>
        </select>
      </label>
      <label class="f">邊距
        <select id="margin">
          <option value="0">無邊距</option>
          <option value="5">5 mm</option>
          <option value="10">10 mm</option>
        </select>
      </label>
    </div>
    <label class="f">縮小檔案（壓縮畫質）
      <select id="preset">
        <option value="none">不縮小（保留文字與原品質）</option>
        <option value="high">高畫質（200 dpi）</option>
        <option value="std">標準（150 dpi）</option>
        <option value="small">小檔案（110 dpi）</option>
        <option value="tiny">極小（80 dpi）</option>
      </select>
    </label>
    <label class="chk" id="grayWrap"><input type="checkbox" id="gray">轉成灰階（黑白文件更省空間）</label>
    <p class="hint" id="presetHint"></p>
    </fieldset>
  </section>

  <section class="box">
    <h2>3. 匯出</h2>
    <p class="plan" id="plan"></p>
    <div class="row">
      <button id="go" class="primary" type="button" disabled>匯出</button>
      <button id="stop" type="button" hidden>停止</button>
    </div>
    <p class="sum" id="sum" style="margin-top:12px"></p>
    <div id="msg" role="status"></div>
    <ul class="notes" id="notes"></ul>
  </section>
</main>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const A4 = [595.28, 841.89];
  const MEDIA = /\.(pdf|jpe?g|png)$/i;
  const PRESETS = { none: null, high: { dpi: 200, q: 0.85 }, std: { dpi: 150, q: 0.75 }, small: { dpi: 110, q: 0.6 }, tiny: { dpi: 80, q: 0.5 } };
  const FALLBACK = PRESETS.high;       // 加密或結構特殊的 PDF 改用圖片方式時的畫質
  const IMG_PT = 72 / 150;             // 圖片以 150 dpi 換算成頁面點數
  const KEY = "pdf-batch-v1";
  const msg = $("#msg"), drop = $("#drop");

  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function show(t, kind) { msg.textContent = t; msg.className = "show" + (kind ? " " + kind : ""); }
  function hide() { msg.className = ""; }
  function tick() { return new Promise((r) => setTimeout(r, 0)); }
  function normRot(a) { a = Math.round(a / 90) * 90; return ((a % 360) + 360) % 360; }
  function today() { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }

  if (!window.PDFLib || !window.pdfjsLib) { show("無法載入 PDF 處理元件，請確認網路連線後重新整理頁面。", "err"); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* ---------- 設定 ---------- */
  function sizeMode() { return document.querySelector("input[name=size]:checked").value; }
  function outMode() { return document.querySelector("input[name=outmode]:checked").value; }
  function readOpts() {
    return { size: sizeMode(), orient: $("#orient").value, margin: +$("#margin").value, pre: PRESETS[$("#preset").value], gray: $("#gray").checked, out: outMode(), max: +$("#zipMax").value };
  }
  const isRaw = (o) => !o.pre && o.size === "orig";   // 不縮小也不轉 A4：檔案原封不動
  function saveSet() {
    try { localStorage.setItem(KEY, JSON.stringify({ size: sizeMode(), out: outMode(), zipMax: $("#zipMax").value, orient: $("#orient").value, margin: $("#margin").value, preset: $("#preset").value, gray: $("#gray").checked })); } catch (e) {}
  }
  function loadSet() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (!s) return;
      const r = document.querySelector("input[name=size][value=" + (s.size === "a4" ? "a4" : "orig") + "]"); if (r) r.checked = true;
      const m = document.querySelector("input[name=outmode][value=" + (s.out === "each" ? "each" : "zip") + "]"); if (m) m.checked = true;
      if (s.zipMax != null && document.querySelector("#zipMax option[value=\"" + s.zipMax + "\"]")) $("#zipMax").value = s.zipMax;
      if (s.orient) $("#orient").value = s.orient;
      if (s.margin) $("#margin").value = s.margin;
      if (s.preset && PRESETS.hasOwnProperty(s.preset)) $("#preset").value = s.preset;
      $("#gray").checked = !!s.gray;
    } catch (e) {}
  }
  function renderNotes() {
    $("#notes").innerHTML = outMode() === "zip"
      ? "<li>原檔完全不會被動到。結果直接下載到瀏覽器的下載資料夾，不需要任何資料夾權限。</li>" +
        "<li>ZIP 只是把檔案打包在一起，PDF 和圖片本來就壓不小；想真的縮小，要在上面選「縮小檔案」的畫質。</li>" +
        "<li>設了大小上限時，會依檔名順序自動分成多個 ZIP（_1、_2…）。分包會一次下載多個檔案，瀏覽器若詢問「允許下載多個檔案」請按允許。單一檔案本身超過上限時，它會自己成一包。</li>" +
        "<li>打包期間結果會暫存在記憶體，總量太大請分批。</li>"
      : "<li>每個檔案會各別下載，檔案多時瀏覽器可能詢問「允許下載多個檔案」，請按允許。</li>";
  }
  function refreshControls() {
    const o = readOpts(), comp = !!o.pre;
    $("#a4opts").hidden = o.size !== "a4";
    $("#zipWrap").hidden = o.out !== "zip"; $("#zipMaxWrap").hidden = o.out !== "zip";
    $("#gray").disabled = !comp; $("#grayWrap").style.opacity = comp ? 1 : 0.5;
    $("#presetHint").textContent = comp
      ? "縮小會把每一頁轉成圖片，文字將無法選取、搜尋或複製。掃描檔效果最好；本來就很小的檔案可能反而變大。"
      : (o.out === "zip" && o.size === "orig"
          ? "目前的設定不會改動任何檔案，只是原封不動打包進 ZIP。"
          : "不縮小時，PDF 的文字與向量內容會保留。圖片檔一律轉成 JPEG 放入。");
    renderNotes(); refreshPlan();
  }
  function onSetChange() { refreshControls(); saveSet(); resetResults(); }
  ["orient", "margin", "preset", "gray", "zipMax"].forEach((id) => $("#" + id).addEventListener("input", onSetChange));
  document.querySelectorAll("input[name=size], input[name=outmode]").forEach((r) => r.addEventListener("change", onSetChange));
  $("#zipName").value = "壓縮結果_" + today() + ".zip";
  function checkOpts() {
    const o = readOpts();
    if (isRaw(o) && o.out !== "zip") {
      show("目前的設定不會改變檔案內容，分別下載就和原檔一樣。請改選「打包成 ZIP 檔」，或選「全部統一成 A4」、一個縮小畫質。", "warn");
      return null;
    }
    return o;
  }

  /* ---------- 處理單一檔案的核心（與「PDF 頁面整理」相同） ---------- */
  function dispDims(p) { return p.rot % 180 ? [p.bh, p.bw] : [p.bw, p.bh]; }

  function drawRot(c, im, rot) {
    const ctx = c.getContext("2d");
    ctx.save(); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(rot * Math.PI / 180);
    const iw = rot % 180 ? c.height : c.width, ih = rot % 180 ? c.width : c.height;
    ctx.drawImage(im, -iw / 2, -ih / 2, iw, ih); ctx.restore();
  }

  /* 算出輸出頁面大小，以及內容放置的位置（A4 模式等比縮放後置中） */
  function layout(o, dw, dh) {
    let W = dw, H = dh, m = 0, s = 1;
    if (o.size === "a4") {
      W = A4[0]; H = A4[1];
      if (o.orient === "landscape" || (o.orient === "auto" && dw > dh)) { W = A4[1]; H = A4[0]; }
      m = o.margin * 72 / 25.4;
      s = Math.min((W - 2 * m) / dw, (H - 2 * m) / dh);
    }
    const w = dw * s, h = dh * s;
    return { W, H, s, w, h, x: (W - w) / 2, y: (H - h) / 2 };
  }
  /* 順時針旋轉 R 度時，drawPage / drawImage 的起點與旋轉角（pdf-lib 以起點為軸、逆時針為正） */
  function origin(R, X0, Y0, sw, sh) {
    if (R === 90) return { x: X0, y: Y0 + sw, rot: 270 };
    if (R === 180) return { x: X0 + sw, y: Y0 + sh, rot: 180 };
    if (R === 270) return { x: X0 + sh, y: Y0, rot: 90 };
    return { x: X0, y: Y0, rot: 0 };
  }
  function toGray(c) {
    const ctx = c.getContext("2d"), d = ctx.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) { const g = (a[i] * 299 + a[i + 1] * 587 + a[i + 2] * 114) / 1000 | 0; a[i] = a[i + 1] = a[i + 2] = g; }
    ctx.putImageData(d, 0, 0);
  }
  async function placeCanvas(out, c, o, pre, L) {
    if (o.gray && o.pre) toGray(c);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", pre.q));

  /* 把一串頁面組成一份 PDF。list 內每一項只需要 type、src、idx、rot、bw、bh，不需要畫面上的卡片 */
  async function buildPdf(list, o, say) {
    const out = await PDFLib.PDFDocument.create();
    const embeds = new Map(), rasterSrc = new Set(), usedBy = new Map();
    list.forEach((p) => { if (p.src) usedBy.set(p.src.id, (usedBy.get(p.src.id) || 0) + 1); });

    if (!o.pre) {   /* 不壓縮：保留向量與文字。每個來源檔一次處理，共用的字型等資源只會存一份 */
      const groups = new Map();
      list.forEach((p) => {
        if (p.type !== "pdf") return;
        if (!groups.has(p.src.id)) groups.set(p.src.id, { src: p.src, idx: new Set() });
        groups.get(p.src.id).idx.add(p.idx);
      });
      for (const g of groups.values()) {
        say("準備 " + g.src.name + "…"); await tick();
        try {
          const lib = await PDFLib.PDFDocument.load(g.src.buf, { ignoreEncryption: true });
          if (lib.isEncrypted) throw new Error("encrypted");
          const idxs = Array.from(g.idx).sort((a, b) => a - b);
          const lps = idxs.map((i) => lib.getPage(i));
          const inh = lps.map((lp) => normRot(lp.getRotation().angle));
          if (o.size === "a4") {
            const bbs = lps.map((lp) => { const c = lp.getCropBox(); return { left: c.x, bottom: c.y, right: c.x + c.width, top: c.y + c.height }; });
            const emb = await out.embedPages(lps, bbs);
            idxs.forEach((i, k) => embeds.set(g.src.id + ":" + i, { e: emb[k], inh: inh[k] }));
          } else {
            const cp = await out.copyPages(lib, idxs);
            idxs.forEach((i, k) => embeds.set(g.src.id + ":" + i, { pg: cp[k], inh: inh[k] }));
          }
        } catch (err) { rasterSrc.add(g.src.id); }
      }
    }

    for (let k = 0; k < list.length; k++) {
      const p = list[k];
      say("處理中 " + (k + 1) + " / " + list.length + "…"); await tick();
      if (p.type === "blank") { const d = dispDims(p), L = layout(o, d[0], d[1]); out.addPage([L.W, L.H]); continue; }
      if (p.type === "img") { await addImagePage(out, p, o); continue; }
      const E = embeds.get(p.src.id + ":" + p.idx);
      if (!E) { await addRasterPage(out, p, o, o.pre || FALLBACK); continue; }

      } else {
        E.pg.setRotation(PDFLib.degrees(R)); out.addPage(E.pg);
      }
    }

    say("儲存中…"); await tick();
    const bytes = await out.save();
    return { bytes, pageCount: out.getPageCount(), rasterSrc, usedBy };
  }

  function saveBlob(bytes, name) {

  /* ---------- 檔案清單 ---------- */
  function entryFile(en) { return new Promise((ok, no) => en.file(ok, no)); }

    });

  async function walkDir(dirEn, dirs, out) {
    for (const k of await readAll(dirEn.createReader())) {

        else if (k.isDirectory) await walkDir(k, dirs.concat(k.name), out);

  const fullName = (it) => (it.dirs.length ? it.dirs.join("/") + "/" : "") + it.name;

  async function processOne(it, file, o, say) {
    if (/\.pdf$/i.test(it.name)) {
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false }).promise;
      try {
        const src = { id: 1, name: it.name, kind: "pdf", size: file.size, buf, doc, n: doc.numPages };
        const list = [];
        for (let i = 0; i < doc.numPages; i++) list.push({ type: "pdf", src, idx: i, rot: 0, bw: 0, bh: 0 });
        return await buildPdf(list, o, say);

      const src = { id: 1, name: it.name, kind: "img", size: file.size, img: im, n: 1 };
      return await buildPdf([{ type: "img", src, idx: 0, rot: 0, bw: im.naturalWidth * IMG_PT, bh: im.naturalHeight * IMG_PT }], o, say);

  let files = [], nextId = 1, busy = false, stopFlag = false;

  function addFiles(list) {
    const have = new Set(files.map(fkey)); let added = 0, skipped = 0;
    for (const x of list) {
      if (!MEDIA.test(x.file.name)) continue;
      const it = { id: nextId++, name: x.file.name, dirs: x.dirs, file: x.file, res: null, status: "", el: null };
      if (have.has(fkey(it))) { skipped++; continue; }

    it.el.mt.textContent = it.status || size(it.file.size);
  }
  function renderList() {
    const ul = $("#blist"); ul.innerHTML = "";
    $("#listWrap").hidden = !files.length;
    let total = 0;
    for (const it of files) {
      total += it.file.size;
      const li = document.createElement("li"), nm = document.createElement("span"), mt = document.createElement("span"), x = document.createElement("button");
      li.dataset.id = it.id; nm.className = "nm"; mt.className = "mt";
      nm.textContent = fullName(it); nm.title = nm.textContent;
      x.type = "button"; x.className = "x"; x.textContent = "×"; x.title = "從清單移除"; x.setAttribute("aria-label", "移除 " + it.name);
      li.append(nm, mt, x); ul.appendChild(li); it.el = { li, mt }; paintRow(it);
    }

  function resetResults() {

  }
  function refreshPlan() {
    const o = readOpts(), n = files.length, total = files.reduce((a, f) => a + f.file.size, 0), el = $("#plan");
    if (!n) { el.textContent = "還沒有加入檔案。"; return; }
    const todo = isRaw(o) ? "" : "先" + [o.size === "a4" ? "統一成 A4" : "", o.pre ? "縮小畫質" + (o.gray ? "（灰階）" : "") : ""].filter(Boolean).join("、") + "，再";
    if (o.out !== "zip") { el.textContent = n + " 個檔案（" + size(total) + "）：" + todo + "每個檔案分別下載。"; return; }
    const lim = limitOf(o);
    if (isRaw(o)) {
      const g = splitGroups(files.map((f) => ({ name: fullName(f), len: f.file.size })), lim).length;
      el.textContent = n + " 個檔案（" + size(total) + "）：原封不動打包，會產生 " + g + " 個 ZIP" + (lim < Infinity ? "（每個不超過 " + o.max + " MB）" : "") + "。";
    } else {
      el.textContent = n + " 個檔案（" + size(total) + "）：" + todo + "打包成 ZIP" + (lim < Infinity ? "，每個不超過 " + o.max + " MB" : "") + "。處理完才知道實際大小與 ZIP 數量。";

  function setRunning(r) {

    $("#clearAll").disabled = r; $("#pickDir").disabled = r; $("#pickFiles").disabled = r;
    $("#blist").classList.toggle("lock", r);
  }

  /* ---------- 匯出 ---------- */
  async function runExport() {
    if (busy || !files.length) return;
    const o = checkOpts(); if (!o) return;
    const items = files.slice(), raw = isRaw(o), zip = o.out === "zip", zipEntries = [], used = new Map(), sum = $("#sum");
    hide(); resetResults(); setRunning(true); stopFlag = false;
    let before = 0, after = 0, ok = 0, bad = 0, kept = 0, done = 0, zipBytes = 0;
    for (let i = 0; i < items.length; i++) {
      if (stopFlag) break;
      const it = items[i];
      it.status = raw ? "讀取中…" : "處理中…"; paintRow(it);
      if (it.el) it.el.li.scrollIntoView({ block: "nearest" });
      sum.className = "sum"; sum.textContent = (raw ? "讀取中 " : "處理中 ") + (i + 1) + " / " + items.length + "…";
      try {
        const file = it.file; let bytes, note = "", baseName;
        if (raw) { bytes = new Uint8Array(await file.arrayBuffer()); baseName = it.name; }
        else {
          const r = await processOne(it, file, o, (t) => { it.status = t; paintRow(it); });
          bytes = r.bytes; baseName = it.name.replace(/\.(jpe?g|png)$/i, ".pdf");

          } else if (r.rasterSrc.size) note = "加密檔，已轉成圖片";

          zipEntries.push({ name: (key ? key + "/" : "") + outName, data: bytes });
        } else { saveBlob(bytes, outName); await new Promise((res) => setTimeout(res, 400)); }
        before += file.size; after += bytes.length; ok++;
        it.status = raw ? size(file.size) + " ✓" : size(file.size) + " → " + size(bytes.length) + "（" + Math.round(bytes.length / Math.max(1, file.size) * 100) + "%）" + (note ? " · " + note : "");
        it.res = { warn: !raw && bytes.length > file.size };

      const groups = splitGroups(zipEntries.map((e) => ({ name: e.name, len: e.data.length })), lim);

    if (ok && before) t += raw ? "，合計 " + size(before) : "，合計 " + size(before) + " → " + size(after) + "（約 " + Math.round(after / before * 100) + "%）";
    if (kept) t += "；" + kept + " 個縮小後沒變小，已保留原檔";

  $("#go").addEventListener("click", runExport);
  $("#stop").addEventListener("click", () => { stopFlag = true; $("#sum").textContent = "停止中，會在目前這個檔案處理完後停下…"; });

  /* ---------- 加入檔案：選擇與拖曳 ---------- */
  drop.addEventListener("click", () => { if (!busy) $("#dirIn").click(); });

  $("#pickDir").addEventListener("click", () => $("#dirIn").click());
  $("#pickFiles").addEventListener("click", () => $("#fileIn").click());
  $("#dirIn").addEventListener("change", function () {

    afterAdd(addFiles(arr));

  ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); if (!busy) drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, () => drop.classList.remove("over")));
  drop.addEventListener("drop", async (e) => {
    e.preventDefault();

    const ents = e.dataTransfer.items ? Array.from(e.dataTransfer.items).map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean) : [];
    const plain = Array.from(e.dataTransfer.files);

        for (const en of ents) {
          if (en.isDirectory) await walkDir(en, single ? [] : [en.name], out);
          else if (MEDIA.test(en.name)) out.push({ file: await entryFile(en), dirs: [] });
        }
      } else plain.forEach((f) => out.push({ file: f, dirs: [] }));
      afterAdd(addFiles(out));
    } catch (err) { show("無法讀取：" + ((err && (err.name + " " + err.message)) || err), "err"); }
  });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => { if (!drop.contains(e.target)) e.preventDefault(); });

  loadSet(); refreshControls(); renderList();
})();
</script>
<script>
(function () {
  function cur() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
  function sync() { var t = cur(); document.querySelectorAll("a[data-nav]").forEach(function (a) { a.href = a.getAttribute("data-nav") + "?theme=" + t; }); }
  var b = document.getElementById("themeBtn");
  if (b) b.addEventListener("click", function () {
    var n = cur() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    try { localStorage.setItem("pdf-tools-theme", n); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
</body>
</html>
