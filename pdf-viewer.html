<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 預覽器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --fg: #1d2421; --muted: #67716c; --line: #dde1dd;
    --accent: #0f6e5a; --accent-fg: #ffffff; --accent-soft: #e2f1ec; --stage: #c9cecb; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a18; --panel: #1e2522; --fg: #e8ece9; --muted: #98a39d; --line: #313a36;
      --accent: #3fb598; --accent-fg: #0b1512; --accent-soft: #1d332d; --stage: #0f1311; --danger: #f2a49d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.45 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .side-top { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .side-top h1 { font-size: 1.05rem; margin: 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); padding: 6px 10px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  #q { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; width: 100%; }
  .count { color: var(--muted); font-size: .82rem; }
  #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; }
  #list li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  #list li:hover { background: var(--bg); }
  #list li.cur { background: var(--accent-soft); border-color: var(--accent); }
  .th { width: 44px; height: 58px; flex: none; background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: .7rem; }
  .th img { max-width: 100%; max-height: 100%; display: block; }
  .li-info { min-width: 0; flex: 1; }
  .li-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-meta { color: var(--muted); font-size: .78rem; }
  .li-meta.bad { color: var(--danger); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar .title { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .bar .zoom { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: center; }
  #stage { flex: 1; min-height: 0; overflow: auto; background: var(--stage); padding: 16px; }
  .pg { margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.25); position: relative; }
  .pg canvas { display: block; }
  .pgno { position: absolute; right: -2px; top: 100%; margin-top: 2px; color: var(--muted); font-size: .72rem; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; padding: 0 20px; }
  .empty.err { color: var(--danger); }
  #drop.over { outline: 3px dashed var(--accent); outline-offset: -8px; }
  .bar .muted { color: var(--muted); font-size: .85rem; }
  .bar input[type=text] { flex: 1; min-width: 160px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; }
  .bar input[type=text]:disabled { opacity: .5; }
  #rnMsg { flex-basis: 100%; min-height: 1.2em; }
  @media (max-width: 720px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: 280px 80vh; height: auto; }
  }
</style>
</head>
<body>
<div class="app" id="drop">
  <aside>
    <div class="side-top">
      <h1>PDF 預覽器</h1>
      <div class="btns">
        <button class="primary" id="pickDir">選擇資料夾</button>
        <button id="pickFiles">加入檔案</button>
        <button id="clear">清空</button>
      </div>
      <input id="q" type="search" placeholder="用檔名搜尋" aria-label="用檔名搜尋">
      <div class="count" id="count">尚未載入檔案</div>
    </div>
    <ul id="list"></ul>
  </aside>
  <main>
    <div class="bar">
      <button id="prev" disabled>◀ 上一個</button>
      <button id="next" disabled>下一個 ▶</button>
      <span class="title" id="title">請在左側選擇資料夾，或把 PDF 拖進來</span>
      <button id="zout" disabled aria-label="縮小">－</button>
      <span class="zoom" id="zoomTxt">—</span>
      <button id="zin" disabled aria-label="放大">＋</button>
      <button id="fit" disabled>適合寬度</button>
      <button id="z100" disabled>100%</button>
    </div>
    <div class="bar" id="rnBar">
      <span class="muted">檔名</span>
      <input id="rn" type="text" disabled spellcheck="false" aria-label="新檔名（不含副檔名）">
      <span class="muted" id="ext"></span>
      <button class="primary" id="rnGo" disabled>改名並到下一個</button>
      <button id="rnOnly" disabled>只改名</button>
      <button id="rnUndo" disabled>復原上一次</button>
      <span class="muted" id="rnMsg">要改名，請用「選擇資料夾」按鈕開啟資料夾（Chrome 或 Edge）。</span>
    </div>
    <div id="stage"><p class="empty">預覽在你的瀏覽器內完成，檔案不會上傳。<br>選好資料夾後，用 ↑ ↓ 鍵可以快速切換檔案。</p></div>
  </main>
</div>
<input id="dirIn" type="file" webkitdirectory multiple hidden>
<input id="fileIn" type="file" accept="application/pdf" multiple hidden>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var pathOf = new WeakMap(), hOf = new WeakMap(), dirNote = "", noHandles = false;
  var files = [], nextId = 1, curId = null, view = [];
  var curDoc = null, openTok = 0, layTok = 0, scale = 1, fitMode = true, observer = null;
  var stage = $("#stage"), list = $("#list");

  if (!window.pdfjsLib) {
    stage.innerHTML = '<p class="empty err">無法載入 PDF 顯示元件，請確認網路連線後重新整理頁面。</p>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function byId(id) { return files.find(function (f) { return f.id === id; }); }

  /* ---------- 檔案清單 ---------- */
  function addFiles(list, replace) {
    if (!replace) dirNote = "";
    var pdfs = Array.from(list).filter(function (f) { return f.type === "application/pdf" || /\.pdf$/i.test(f.name); });
    if (replace) { files = []; curId = null; closeDoc(); }
    pdfs.forEach(function (f) { files.push({ id: nextId++, file: f, name: f.name, path: pathOf.get(f) || f.webkitRelativePath || f.name, h: hOf.get(f) || null,
      size: f.size, pages: null, thumb: null, err: false, queued: false }); });
    files.sort(function (a, b) { return a.name.localeCompare(b.name, "zh-Hant", { numeric: true }); });
    renderList();
    if (pdfs.length && curId === null) openFile(view.length ? view[0].id : files[0].id);
    if (!pdfs.length) $("#count").textContent = "沒有找到 PDF 檔案";
  }

  function renderList() {
    var q = $("#q").value.trim().toLowerCase();
    view = files.filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) !== -1; });
    list.innerHTML = view.map(function (f) { return liHtml(f); }).join("");
    $("#count").textContent = files.length ? (q ? view.length + " / " : "") + files.length + " 個 PDF" : "尚未載入檔案";
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var f = byId(+e.target.dataset.id);
        if (f && !f.thumb && !f.err && !f.queued) { f.queued = true; thumbQ.push(f.id); pump(); }
        observer.unobserve(e.target);
      });
    }, { root: list, rootMargin: "200px" });
    list.querySelectorAll("li").forEach(function (li) { observer.observe(li); });
    updateNav();
  }
  function liHtml(f) {
    return '<li data-id="' + f.id + '" class="' + (f.id === curId ? "cur" : "") + '" title="' + esc(f.path) + '">' +
      '<div class="th">' + (f.thumb ? '<img src="' + f.thumb + '" alt="">' : f.err ? "錯誤" : "…") + '</div>' +
      '<div class="li-info"><div class="li-name">' + esc(f.name) + '</div>' +
      '<div class="li-meta' + (f.err ? " bad" : "") + '">' + (f.err ? "無法讀取" : (f.pages ? f.pages + " 頁 · " : "") + size(f.size)) + '</div></div></li>';
  }
  function refreshLi(id) {
    var li = list.querySelector('li[data-id="' + id + '"]'), f = byId(id);
    if (li && f) li.outerHTML = liHtml(f);
    var n = list.querySelector('li[data-id="' + id + '"]'); if (n && observer) observer.unobserve(n);
  }

  /* ---------- 縮圖（逐一處理，避免卡頓） ---------- */
  var thumbQ = [], thumbBusy = false;
  async function pump() {
    if (thumbBusy) return; thumbBusy = true;
    while (thumbQ.length) {
      var f = byId(thumbQ.shift()); if (!f || f.thumb) continue;
      try {
        var doc = await pdfjsLib.getDocument({ data: await f.file.arrayBuffer(), isEvalSupported: false }).promise;
        var pg = await doc.getPage(1), v0 = pg.getViewport({ scale: 1 }), s = 120 / v0.height;
        var vp = pg.getViewport({ scale: s }), c = document.createElement("canvas");
        c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        f.thumb = c.toDataURL("image/jpeg", 0.7); f.pages = doc.numPages; doc.destroy();
      } catch (e) { f.err = true; }
      refreshLi(f.id);
    }
    thumbBusy = false;
  }

  /* ---------- 檢視 ---------- */
  function closeDoc() { if (curDoc) { try { curDoc.destroy(); } catch (e) {} curDoc = null; } }

  async function openFile(id) {
    var f = byId(id); if (!f) return;
    curId = id; var tok = ++openTok;
    list.querySelectorAll("li.cur").forEach(function (n) { n.classList.remove("cur"); });
    var li = list.querySelector('li[data-id="' + id + '"]');
    if (li) { li.classList.add("cur"); li.scrollIntoView({ block: "nearest" }); }
    $("#title").textContent = f.name;
    setupRename(f);
    stage.innerHTML = '<p class="empty">載入中…</p>';
    updateNav();
    try {
      var doc = await pdfjsLib.getDocument({ data: await f.file.arrayBuffer(), isEvalSupported: false }).promise;
      if (tok !== openTok) { doc.destroy(); return; }
      closeDoc(); curDoc = doc;
      f.pages = doc.numPages; f.err = false; refreshLi(id);
      var n = list.querySelector('li[data-id="' + id + '"]'); if (n) n.classList.add("cur");
      fitMode = true;
      await layout();
    } catch (e) {
      if (tok !== openTok) return;
      closeDoc();
      stage.innerHTML = '<p class="empty err">這個檔案無法開啟，可能已加密或檔案損毀。</p>';
      f.err = true; refreshLi(id);
    }
    updateNav();
  }

  async function layout() {
    if (!curDoc) return;
    var tok = ++layTok, doc = curDoc;
    try {
      var first = await doc.getPage(1), v1 = first.getViewport({ scale: 1 });
      if (tok !== layTok) return;
      if (fitMode) scale = Math.max(0.25, Math.min(4, (stage.clientWidth - 34) / v1.width));
      $("#zoomTxt").textContent = Math.round(scale * 100) + "%";
      stage.innerHTML = "";
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); renderPage(e.target, tok, doc); } });
      }, { root: stage, rootMargin: "800px" });
      for (var n = 1; n <= doc.numPages; n++) {
        var d = document.createElement("div");
        d.className = "pg"; d.dataset.n = n;
        d.style.width = Math.round(v1.width * scale) + "px"; d.style.height = Math.round(v1.height * scale) + "px";
        stage.appendChild(d); io.observe(d);
      }
      stage.scrollTop = 0;
    } catch (e) {}
  }

  async function renderPage(div, tok, doc) {
    try {
      var page = await doc.getPage(+div.dataset.n);
      if (tok !== layTok) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = page.getViewport({ scale: scale }), rv = page.getViewport({ scale: scale * dpr });
      var c = document.createElement("canvas");
      c.width = Math.floor(rv.width); c.height = Math.floor(rv.height);
      c.style.width = Math.floor(vp.width) + "px"; c.style.height = Math.floor(vp.height) + "px";
      div.style.width = c.style.width; div.style.height = c.style.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: rv }).promise;
      if (tok !== layTok) return;
      div.appendChild(c);
      if (doc.numPages > 1) { var s = document.createElement("span"); s.className = "pgno"; s.textContent = div.dataset.n + " / " + doc.numPages; div.appendChild(s); }
    } catch (e) {}
  }

  function updateNav() {
    var i = view.findIndex(function (f) { return f.id === curId; });
    $("#prev").disabled = i <= 0; $("#next").disabled = i < 0 || i >= view.length - 1;
    ["zout", "zin", "fit", "z100"].forEach(function (id) { $("#" + id).disabled = !curDoc; });
  }
  function step(d) {
    var i = view.findIndex(function (f) { return f.id === curId; }), j = i + d;
    if (i >= 0 && j >= 0 && j < view.length) openFile(view[j].id);
  }
  function zoom(f) { if (!curDoc) return; fitMode = false; scale = Math.max(0.25, Math.min(4, f)); layout(); }

  /* ---------- 改名 ---------- */
  var undoStack = [], renaming = false;
  function rmsg(t, err) { var m = $("#rnMsg"); m.textContent = t; m.style.color = err ? "var(--danger)" : "var(--muted)"; }
  function extOf(name) { var m = name.match(/\.[^.]+$/); return m ? m[0] : ".pdf"; }
  function setupRename(f) {
    var ok = !!(f && f.h);
    $("#rn").disabled = !ok; $("#rnGo").disabled = !ok; $("#rnOnly").disabled = !ok;
    $("#rnUndo").disabled = !undoStack.length;
    $("#rn").value = f ? f.name.slice(0, f.name.length - extOf(f.name).length) : "";
    $("#ext").textContent = f ? extOf(f.name) : "";
    if (f && !f.h) rmsg(dirNote ? "無法改名，因為瀏覽器沒有給改名權限。原因：" + dirNote + "。若是系統資料夾（桌面、文件、下載）請改選它底下的子資料夾。" : "這個檔案不是用「選擇資料夾」按鈕開啟的，無法改名。", !!dirNote);
    else if (f) rmsg("輸入新檔名後按 Enter：改名並跳到下一個。按 F2 可快速移到檔名欄。", false);
  }
  async function doRename(f, newName) {
    var parent = f.h.parent, oldName = f.name;
    var caseOnly = newName.toLowerCase() === oldName.toLowerCase();
    if (!caseOnly) {
      var exists = true;
      try { await parent.getFileHandle(newName); }
      catch (e) { if (e.name === "NotFoundError") exists = false; else if (e.name !== "TypeMismatchError") throw e; }
      if (exists) throw new Error("同一個資料夾已經有「" + newName + "」");
    }
    var done = false;
    if (typeof f.h.handle.move === "function") { try { await f.h.handle.move(newName); done = true; } catch (e) {} }
    if (!done) {
      if (caseOnly) throw new Error("這個瀏覽器無法只更改大小寫");
      var nh = await parent.getFileHandle(newName, { create: true });
      try {
        var w = await nh.createWritable(); await w.write(f.file); await w.close();
        if ((await nh.getFile()).size !== f.file.size) throw new Error("複製後大小不一致，已取消，原檔沒有動");
      } catch (e) { try { await parent.removeEntry(newName); } catch (x) {} throw e; }
      await parent.removeEntry(oldName);
      f.h.handle = nh;
    }
    f.file = await f.h.handle.getFile();
    f.path = f.path.slice(0, f.path.length - oldName.length) + newName;
    f.name = newName;
    files.sort(function (a, b) { return a.name.localeCompare(b.name, "zh-Hant", { numeric: true }); });
  }
  async function nameFree(parent, name) {
    try { await parent.getFileHandle(name); return false; }
    catch (e) { if (e.name === "NotFoundError") return true; if (e.name === "TypeMismatchError") return false; throw e; }
  }
  /* 遇到同名時自動加上 (1)、(2)…，和瀏覽器下載的做法一樣 */
  async function uniqueName(f, name) {
    if (name.toLowerCase() === f.name.toLowerCase()) return name;
    var ext = extOf(name), stem = name.slice(0, name.length - ext.length), cand = name, n = 0;
    while (!(await nameFree(f.h.parent, cand))) {
      if (++n > 9999) throw new Error("同名檔案太多，無法自動編號");
      cand = stem + " (" + n + ")" + ext;
    }
    return cand;
  }
  async function renameCur(goNext) {
    var f = byId(curId); if (!f || !f.h || renaming) return;
    var ext = extOf(f.name), base = $("#rn").value.trim();
    if (base.toLowerCase().slice(-ext.length) === ext.toLowerCase()) base = base.slice(0, base.length - ext.length).trim();
    if (!base) return rmsg("檔名不能是空的。", true);
    if (/[\\\/:*?"<>|\u0000-\u001f]/.test(base)) return rmsg("檔名不能包含  \\ / : * ? \" < > |", true);
    if (/[. ]$/.test(base)) return rmsg("檔名結尾不能是句點或空白。", true);
    var newName = base + ext, i = view.findIndex(function (x) { return x.id === curId; });
    var nextF = i >= 0 ? view[i + 1] : null;
    if (newName === f.name) { if (goNext && nextF) { await openFile(nextF.id); $("#rn").focus(); $("#rn").select(); } return; }
    renaming = true;
    try {
      var old = f.name, asked = newName;
      newName = await uniqueName(f, newName);
      await doRename(f, newName);
      undoStack.push({ id: f.id, oldName: old, newName: newName });
      renderList(); $("#title").textContent = f.name;
      if (goNext && nextF) { await openFile(nextF.id); $("#rn").focus(); $("#rn").select(); }
      else setupRename(f);
      rmsg((newName !== asked ? "已有同名檔案，自動加上編號。" : "") + "已改名：" + old + " → " + newName, false);
      $("#rnUndo").disabled = false;
    } catch (e) { rmsg("改名失敗：" + (e.message || e.name), true); }
    renaming = false;
  }
  async function undoRename() {
    var u = undoStack[undoStack.length - 1]; if (!u || renaming) return;
    var f = byId(u.id); if (!f) { undoStack.pop(); setupRename(byId(curId)); return; }
    renaming = true;
    try {
      await doRename(f, u.oldName); undoStack.pop(); renderList();
      if (curId === f.id) { $("#title").textContent = f.name; setupRename(f); } else $("#rnUndo").disabled = !undoStack.length;
      rmsg("已復原：" + u.newName + " → " + u.oldName, false);
    } catch (e) { rmsg("復原失敗：" + (e.message || e.name), true); }
    renaming = false;
  }
  $("#rnGo").addEventListener("click", function () { renameCur(true); });
  $("#rnOnly").addEventListener("click", function () { renameCur(false); });
  $("#rnUndo").addEventListener("click", undoRename);
  $("#rn").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); renameCur(!e.shiftKey); }
    else if (e.key === "Escape") this.blur();
  });

  /* ---------- 事件 ---------- */
  list.addEventListener("click", function (e) { var li = e.target.closest("li"); if (li) openFile(+li.dataset.id); });
  $("#q").addEventListener("input", renderList);
  $("#prev").addEventListener("click", function () { step(-1); });
  $("#next").addEventListener("click", function () { step(1); });
  $("#zin").addEventListener("click", function () { zoom(scale * 1.2); });
  $("#zout").addEventListener("click", function () { zoom(scale / 1.2); });
  $("#fit").addEventListener("click", function () { fitMode = true; layout(); });
  $("#z100").addEventListener("click", function () { zoom(1); });
  async function walk(dir, prefix, out) {
    for await (var ent of dir.values()) {
      if (ent.kind === "file") {
        if (/\.pdf$/i.test(ent.name)) { var f = await ent.getFile(); pathOf.set(f, prefix + ent.name); if (!noHandles) hOf.set(f, { parent: dir, handle: ent }); out.push(f); }
      } else { await walk(ent, prefix + ent.name + "/", out); }
    }
  }
  $("#pickDir").addEventListener("click", async function () {
    if (window.showDirectoryPicker) {
      try {
        var dir = await window.showDirectoryPicker({ mode: "readwrite" });
        $("#count").textContent = "讀取資料夾中…";
        var out = []; await walk(dir, "", out);
        addFiles(out, true); return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        dirNote = ((e && e.name) || "") + " " + ((e && e.message) || "");
      }
    } else dirNote = "這個瀏覽器不支援改名功能（請改用 Chrome 或 Edge）";
    $("#dirIn").click();
  });
  $("#pickFiles").addEventListener("click", function () { $("#fileIn").click(); });
  $("#dirIn").addEventListener("change", function () {
    var n = this.files.length; addFiles(this.files, true);
    if (!n) $("#count").textContent = "瀏覽器沒有回傳任何檔案，可能被公司設定擋住；請改用「加入檔案」或直接拖曳。";
    this.value = "";
  });
  $("#fileIn").addEventListener("change", function () { addFiles(this.files, false); this.value = ""; });
  $("#clear").addEventListener("click", function () {
    files = []; view = []; curId = null; ++openTok; ++layTok; thumbQ.length = 0; closeDoc();
    renderList(); $("#title").textContent = "請在左側選擇資料夾，或把 PDF 拖進來";
    $("#zoomTxt").textContent = "—";
    stage.innerHTML = '<p class="empty">已清空。</p>'; updateNav();
    undoStack = []; setupRename(null); rmsg("要改名，請用「選擇資料夾」按鈕開啟資料夾（Chrome 或 Edge）。", false);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "F2") { e.preventDefault(); if (!$("#rn").disabled) { $("#rn").focus(); $("#rn").select(); } return; }
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "+" || e.key === "=") zoom(scale * 1.2);
    else if (e.key === "-") zoom(scale / 1.2);
  });

  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (fitMode && curDoc) layout(); }, 200); });

  var app = $("#drop");
  ["dragenter", "dragover"].forEach(function (n) { app.addEventListener(n, function (e) { e.preventDefault(); app.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (n) { app.addEventListener(n, function () { app.classList.remove("over"); }); });
  function entryFile(en) { return new Promise(function (ok, no) { en.file(ok, no); }); }
  function readAll(reader) {
    return new Promise(function (ok, no) {
      var all = [];
      (function next() { reader.readEntries(function (b) { if (!b.length) ok(all); else { all = all.concat(Array.from(b)); next(); } }, no); })();
    });
  }
  var skipped = [];
  async function walkEntry(en, prefix, out) {
    try {
      if (en.isFile) {
        if (/\.pdf$/i.test(en.name)) { var f = await entryFile(en); pathOf.set(f, prefix + en.name); out.push(f); }
      } else if (en.isDirectory) {
        var kids = await readAll(en.createReader());
        for (var k of kids) await walkEntry(k, prefix + en.name + "/", out);
      }
    } catch (err) { skipped.push(prefix + en.name); }
  }
  app.addEventListener("drop", async function (e) {
    e.preventDefault();
    var dt = e.dataTransfer, ents = [];
    /* 這些必須在 await 之前同步取得，否則拖曳資料會失效 */
    var hps = dt.items ? Array.from(dt.items).map(function (it) {
      return it.kind === "file" && it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(function () { return null; }) : null;
    }) : [];
    if (dt.items) Array.from(dt.items).forEach(function (it) { var en = it.webkitGetAsEntry && it.webkitGetAsEntry(); if (en) ents.push(en); });
    var plain = Array.from(dt.files);

    /* 方法一：取得資料夾控制代碼，會跳出「編輯檔案」的允許提示，之後也能改名 */
    var hs = (await Promise.all(hps)).filter(Boolean);
    var dirs = hs.filter(function (h) { return h.kind === "directory"; });
    if (dirs.length) {
      try {
        $("#count").textContent = "等待你在瀏覽器提示中按「允許」…";
        var granted = true;
        for (var d of dirs) {
          var st = d.requestPermission ? await d.requestPermission({ mode: "readwrite" }) : "denied";
          if (st !== "granted") granted = false;
        }
        $("#count").textContent = "讀取資料夾中…";
        var out2 = []; noHandles = !granted;
        for (var d2 of dirs) await walk(d2, "", out2);
        for (var h of hs) if (h.kind === "file" && /\.pdf$/i.test(h.name)) out2.push(await h.getFile());
        noHandles = false;
        addFiles(out2, false);
        if (!granted) { dirNote = "你沒有允許編輯檔案，所以只能預覽"; setupRename(byId(curId)); }
        return;
      } catch (err) { noHandles = false; /* 失敗就改用方法二 */ }
    }

    /* 方法二：舊式讀取，只能預覽，不能改名 */
    if (ents.some(function (en) { return en.isDirectory; })) {
      try {
        $("#count").textContent = "讀取資料夾中…";
        skipped = [];
        var out = []; for (var en of ents) await walkEntry(en, "", out);
        addFiles(out, false);
        if (skipped.length) $("#count").textContent = "已載入 " + out.length + " 個，" + skipped.length + " 個讀不到：" + skipped.slice(0, 5).join("、") + (skipped.length > 5 ? "…" : "") + "。可改用「選擇資料夾」按鈕補載。";
      } catch (err) { $("#count").textContent = "讀取資料夾失敗：" + ((err && (err.name + " " + err.message)) || String(err)); }
    } else if (plain.length) addFiles(plain, false);
  });
})();
</script>
</body>
</html>
